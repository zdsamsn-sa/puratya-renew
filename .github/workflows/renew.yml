name: 🚀 MWS 自动续期与离线唤醒

on:
  schedule:
    - cron: '0 1 * * *' # 每天 UTC 时间 01:00 执行 (北京时间早上 09:00)
  workflow_dispatch:    # 允许随时手动运行

jobs:
  execute-script:
    name: 🛠️ 运行 Playwright 自动化任务
    runs-on: ubuntu-latest

    steps:
      - name: 📥 检出代码仓库
        uses: actions/checkout@v4

      - name: 🐍 配置 Python 环境 (3.10)
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 📦 安装 Python 核心依赖
        run: |
          python -m pip install --upgrade pip
          pip install requests playwright

      - name: 🌐 下载 Chromium 浏览器内核
        run: playwright install chromium --with-deps

      - name: ▶️ 执行 MWS 续期与唤醒脚本
        env:
          MWS_TOKEN: ${{ secrets.MWS_TOKEN }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: |
          python3 renew.py

      - name: 📸 归档运行截图 (Artifacts)
        # 即使 Python 脚本报错，依然会执行归档，方便排查
        if: always() 
        uses: actions/upload-artifact@v4
        with:
          name: mws-screenshots
          path: ./screenshots/*.png
          retention-days: 7

      - name: 🗑️ 清理旧的工作流记录
        # 【新增功能】保持 GitHub Actions 页面清爽，自动清理旧日志
        if: always()
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ github.token }}
          repository: ${{ github.repository }}
          retain_days: 7       # 保留最近 7 天的记录
          keep_minimum_runs: 5 # 无论如何最少保留 5 条记录
