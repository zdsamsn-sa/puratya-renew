name: MWS Renew

on:
  schedule:
    # UTC 01:00 = 北京时间 09:00，每周一、三、五跑
    - cron: '0 1 * * 1,3,5'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  renew:
    runs-on: ubuntu-latest
    steps:
      # 1. 拉取代码
      - name: Checkout repository
        uses: actions/checkout@v3

      # 2. 设置 Python 环境
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10' # 建议使用 3.8 以上版本

      # 3. 安装 Python 依赖和 Playwright 浏览器内核 (这是解决报错的关键步骤)
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests playwright
          playwright install chromium

     
      - name: 🚀 运行续期脚本
        env:
          MWS_TOKEN: ${{ secrets.MWS_TOKEN }}
          # 通知（与 notify.py 对齐；两套 TG 命名兼容，可并存）
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          SMTP_CONFIG: ${{ secrets.SMTP_CONFIG }}
          TZ: Asia/Shanghai
        run: python3 renew.py
