name: 🚀 MWS 自动续期与离线唤醒

on:
  # 🕒 定时触发: 每天 UTC 时间 01:00 执行 (北京时间早上 09:00)
  schedule:
    - cron: '0 1 * * *'
  
  # 🖱️ 手动触发: 允许随时手动运行
  workflow_dispatch:

jobs:
  execute-script:
    name: 🛠️ 运行 Playwright 自动化任务
    runs-on: ubuntu-latest

    steps:
      - name: 📥 检出代码仓库
        uses: actions/checkout@v4

      - name: 🐍 配置 Python 环境 (3.10)
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          # 💡 已移除 cache: 'pip'，完美解决找不到 requirements.txt 的报错

      - name: 📦 安装 Python 核心依赖
        run: |
          python -m pip install --upgrade pip
          pip install requests playwright

      - name: 🌐 下载 Chromium 浏览器内核
        run: playwright install chromium --with-deps

      - name: ▶️ 执行 MWS 续期与唤醒脚本
        env:
          MWS_TOKEN: ${{ secrets.MWS_TOKEN }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: |
          python3 renew.py

      - name: 📸 归档运行截图 (Artifacts)
        if: always() 
        uses: actions/upload-artifact@v4
        with:
          name: mws-screenshots
          path: ./screenshots/*.png
          retention-days: 7
