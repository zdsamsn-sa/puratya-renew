name: 🚀 MWS 自动续期与离线唤醒

on:
  schedule:
    - cron: '0 1 * * *'
  workflow_dispatch:

# 【关键修复】：赋予脚本删除 Actions 记录的读写权限
permissions:
  actions: write
  contents: read

jobs:
  execute-script:
    name: 🛠️ 运行 Playwright 自动化任务
    runs-on: ubuntu-latest

    steps:
      - name: 📥 检出代码仓库
        uses: actions/checkout@v4

      - name: 🐍 配置 Python 环境 (3.10)
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 📦 安装 Python 核心依赖
        run: |
          python -m pip install --upgrade pip
          pip install requests playwright

      - name: 🌐 下载 Chromium 浏览器内核
        run: playwright install chromium --with-deps

      - name: ▶️ 执行 MWS 续期与唤醒脚本
        env:
          MWS_TOKEN: ${{ secrets.MWS_TOKEN }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: |
          python3 renew.py

      - name: 📸 归档运行截图 (Artifacts)
        if: always() 
        uses: actions/upload-artifact@v4
        with:
          name: mws-screenshots
          path: ./screenshots/*.png
          retention-days: 3 # 截图包也改为只保留 3 天，节省空间

      - name: 🗑️ 清理旧的工作流记录
        if: always()
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ github.token }}
          repository: ${{ github.repository }}
          retain_days: 0       # 0 天（无视天数，只要超出数量就删）
          keep_minimum_runs: 3 # 【激进清理】无论成功失败，永远只保留最近的 3 条记录
